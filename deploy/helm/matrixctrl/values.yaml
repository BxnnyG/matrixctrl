# MatrixCtrl Helm Chart — values.yaml
# Minimal required fields: image.tag, secrets.*

image:
  repository: ghcr.io/bxnnyg/matrixctrl
  tag: "latest"
  pullPolicy: IfNotPresent

# Resource limits.
#
# requests == limits on purpose: that makes the pod QoS class **Guaranteed**
# (oom_score_adj -997) instead of Burstable. Under node-wide memory pressure the
# kubelet derives the kill order from the memory *request* — with the old 128Mi
# request against a 512Mi limit this pod scored 997 and was among the first killed.
#
# It happened: on 2026-08-05 an unrelated 18 GB process exhausted the node and the
# kernel killed matrixctrl while it held 14 MB. An admin panel that dies first under
# node pressure is useless exactly when it is needed (etappe 34, DESIGN §4.32).
#
# QoS is a *pod* property: both containers must have requests == limits, for CPU and
# memory, or the class stays Burstable. Changing only one has no effect at all.
#
# The limits themselves are unchanged — steady-state usage is ~81Mi, and nothing has
# ever approached the ceiling. Lowering it was tempting and rejected: the peak during
# a Helm render has never been measured, and a smaller ceiling would trade a rare
# collateral kill for a self-inflicted one.
resources:
  matrixctrl:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  postgres:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ESS deployment to manage
ess:
  namespace: ess
  release: ess

# Cluster permissions are not configurable, on purpose.
#
# The ClusterRole is scoped to the resource types and verbs MatrixCtrl and the ESS
# chart actually use (etappe 37) — it used to be `*` on everything, which made any
# defect in this app a cluster compromise rather than an ESS one. What it grants is
# derived from call sites and from the chart's rendered kinds, and checked against
# the live API server by `internal/k8s/permissions.go`; a value that let an operator
# widen or narrow it by hand would put that check out of step with reality.
#
# It is still bound cluster-wide, so its namespaced rules apply in every namespace.
# See the comment in templates/clusterrole.yaml for what that still over-grants.

# Persistent storage
storage:
  postgres:
    size: 5Gi
    storageClass: local-path
  config:
    size: 1Gi
    storageClass: local-path

# Ingress / hostname
ingress:
  enabled: true
  host: matrixctrl.example.com
  # Traefik entrypoint — "websecure" for HTTPS, "web" for HTTP
  entrypoint: websecure
  tls: true
  # Set to "letsencrypt" or your cert-manager ClusterIssuer name.
  # Leave empty if TLS is terminated externally (Cloudflare Tunnel etc.).
  certIssuer: ""

# Secrets — leave empty to AUTO-GENERATE on first install.
# Generated values are stored in the matrixctrl Secret and reused across upgrades
# (the Secret carries helm.sh/resource-policy: keep). Only set these if you want
# to manage credentials externally (e.g. SealedSecrets / external-secrets).
secrets:
  # Postgres password for the sidecar. Empty = auto-generate (randAlphaNum 32).
  dbPassword: ""
  # HS256 signing key for JWT tokens. Empty = auto-generate (randAlphaNum 48).
  jwtSecret: ""
  # Initial bootstrap admin password (logged on first run if unset).
  adminPassword: ""

# OIDC via MAS — optional. Leave clientId empty to start in bootstrap mode and
# wire OIDC later via the in-app Setup → "Connect Matrix Login" flow.
oidc:
  enabled: false
  issuer: "https://mas.example.com"
  clientId: ""
  clientSecret: ""
  # Full public URL that MAS will redirect back to after login
  redirectUri: "https://matrixctrl.example.com/api/v1/auth/oidc/callback"
  # Comma-separated list of allowed MAS user IDs (ULIDs). Takes priority over
  # requireAdmin. Leave empty to use the admin check below.
  allowedUsers: ""
  # When true (default), only MAS admins (can_request_admin=true) may log in.
  # MatrixCtrl verifies this via the MAS Admin API using its own client creds.
  requireAdmin: true

# Config seed — path inside the container that is copied into the
# git config repo on first start.  Leave empty to start with no slices.
configSeedPath: ""
