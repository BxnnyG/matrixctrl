apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrixctrl
  namespace: matrixctrl
  labels:
    {{- include "matrixctrl.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate avoids two pods fighting over the PVC and the embedded Postgres
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "matrixctrl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "matrixctrl.selectorLabels" . | nindent 8 }}
      annotations:
        # Force a rollout when the secret changes
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: matrixctrl
      # NOTE: no wait-for-postgres initContainer — Postgres is a sidecar in this
      # same pod and cannot start until initContainers finish (would deadlock).
      # The matrixctrl container retries the DB connection on startup instead.
      #
      # This one is different: it terminates immediately, so it does not deadlock.
      # It exists because the container stopped running as root (P2-27) and the
      # config repo on the PVC was written by earlier root-owned versions —
      # `-rw-r--r-- root root`, which UID 65532 can read and cannot rewrite. Saving
      # config would have failed on every existing installation, which is exactly
      # S11 check #2. fsGroup would be the usual answer and is unavailable here: it
      # would also apply to the Postgres volume, and Postgres refuses to start when
      # its data directory is group-accessible.
      initContainers:
        - name: fix-ownership
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 65532:65532 /data/config-repo || true"]
          # Init containers count towards the pod's QoS class. Without equal
          # requests and limits here the pod is Burstable no matter what the two
          # real containers declare — which is exactly what happened on the first
          # attempt at etappe 34: both containers were correct and the class stayed
          # Burstable. A non-sidecar init container does not add to the pod's
          # effective request (that is max(init), not sum), so these values cost
          # nothing.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: config-repo
              mountPath: /data/config-repo
      containers:
        # ── MatrixCtrl ─────────────────────────────────────────────────────
        - name: matrixctrl
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Applied per container rather than to the pod: the Postgres sidecar
          # alongside this one drops to its own user and needs a writable data
          # directory, so a pod-wide runAsUser would break it. This is the container
          # running MatrixCtrl's own code, which is the surface that matters (P2-27).
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MATRIXCTRL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "matrixctrl.secretName" . }}
                  key: db-password
            - name: MATRIXCTRL_DB_URL
              value: "postgres://matrixctrl:$(MATRIXCTRL_DB_PASSWORD)@127.0.0.1:5432/matrixctrl?sslmode=disable"
            - name: MATRIXCTRL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "matrixctrl.secretName" . }}
                  key: jwt-secret
            {{- if .Values.secrets.adminPassword }}
            - name: MATRIXCTRL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "matrixctrl.secretName" . }}
                  key: admin-password
            {{- end }}
            - name: MATRIXCTRL_ESS_NAMESPACE
              value: {{ .Values.ess.namespace | quote }}
            - name: MATRIXCTRL_ESS_RELEASE
              value: {{ .Values.ess.release | quote }}
            - name: MATRIXCTRL_CONFIG_REPO
              value: /data/config-repo
            {{- if .Values.configSeedPath }}
            - name: MATRIXCTRL_CONFIG_SEED
              value: {{ .Values.configSeedPath | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: MATRIXCTRL_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: MATRIXCTRL_OIDC_REDIRECT_URI
              value: {{ .Values.oidc.redirectUri | quote }}
            - name: MATRIXCTRL_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "matrixctrl.secretName" . }}
                  key: oidc-client-id
            - name: MATRIXCTRL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "matrixctrl.secretName" . }}
                  key: oidc-client-secret
            {{- if .Values.oidc.allowedUsers }}
            - name: MATRIXCTRL_OIDC_ALLOWED_USERS
              value: {{ .Values.oidc.allowedUsers | quote }}
            {{- end }}
            - name: MATRIXCTRL_REQUIRE_ADMIN
              value: {{ .Values.oidc.requireAdmin | quote }}
            {{- end }}
          volumeMounts:
            - name: config-repo
              mountPath: /data/config-repo
            # readOnlyRootFilesystem leaves nothing writable, and go-git writes
            # temporary files. An emptyDir keeps the root read-only without the
            # config repo losing its persistence.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/v1/auth/oidc/available
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/auth/oidc/available
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.matrixctrl | nindent 12 }}

        # ── Postgres sidecar ───────────────────────────────────────────────
        # No securityContext here on purpose. The official Postgres image starts as
        # root and drops to the postgres user itself, which needs CAP_SETUID and
        # CAP_SETGID; dropping all capabilities would stop it booting. Hardening it
        # means replacing the image or moving it out of this pod, which is a bigger
        # change than the finding asked for (P2-27).
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: matrixctrl
            - name: POSTGRES_USER
              value: matrixctrl
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "matrixctrl.secretName" . }}
                  key: db-password
            # Store data in a sub-directory so the PVC root stays clean
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "matrixctrl", "-d", "matrixctrl"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "matrixctrl", "-d", "matrixctrl"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: matrixctrl-postgres
        - name: config-repo
          persistentVolumeClaim:
            claimName: matrixctrl-config
        - name: tmp
          emptyDir: {}
