apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: matrixctrl
  labels:
    {{- include "matrixctrl.labels" . | nindent 4 }}
# What genuinely cannot be namespaced (etappe 40, DESIGN §4.38).
#
# E37 scoped this role by resource type and verb, which removed the escalation
# paths — no `escalate`, no `impersonate`, no CRDs, no `pods/exec`. It left the role
# bound cluster-wide, so its *namespaced* rules still applied in every namespace and
# `kubectl auth can-i list secrets -n kube-system` answered **yes**.
#
# Everything that can live in one namespace now does, in role.yaml. What is left
# here is cluster-scoped in Kubernetes' own terms: you cannot ask for a node in a
# namespace.
rules:
  # Dashboard capacity, and mapping a pod to the node it runs on
  # (k8s/node.go:22, k8s/pods.go:285). Nodes are not namespaced objects.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]

  # Live CPU/memory. Reached via AbsPath("/apis/metrics.k8s.io/v1beta1/nodes"),
  # which is a *resource* URL despite looking like a raw path. Without
  # metrics-server this returns nothing and k8s/node.go already treats that as
  # "no data" rather than as an error.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

  # Greenfield: MatrixCtrl installs ESS into a namespace that may not exist yet
  # (`install.CreateNamespace = true`). No delete — nothing in the product asks to
  # remove a namespace, and it is not a power worth holding by accident.
  #
  # Creating a namespace grants nothing *inside* it. If the operator repoints
  # MATRIXCTRL_ESS_NAMESPACE at a namespace this chart never bound a Role in,
  # MatrixCtrl can create it and then do nothing there — which the permission
  # matrix in internal/k8s/permissions.go reports rather than leaving to be
  # discovered halfway through an install.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]

  # Read-only discovery for Helm's RESTMapper. Kubernetes already grants these to
  # every authenticated account through the built-in `system:discovery` role, so
  # this is redundant on a conformant cluster — stated anyway so the chart does not
  # depend on a default it does not control. What is deliberately *not* restated is
  # the old `nonResourceURLs: ["*"] verbs: ["*"]`, which also permitted POST to
  # arbitrary non-resource paths.
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/version", "/openapi", "/openapi/*"]
    verbs: ["get"]
