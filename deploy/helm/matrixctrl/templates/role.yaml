{{/*
Everything MatrixCtrl does that Kubernetes can confine to a namespace (etappe 40).

This is where the P0-4a fix lives. The same rules used to sit in the ClusterRole
bound cluster-wide, which meant `secrets` — needed for Helm's release storage in
the managed namespace — were readable and writable in *every* namespace, including
kube-system. Moving them here confines them to the namespace this panel exists to
administer.

Two Roles, deliberately, rather than one ClusterRole bound twice: the managed
namespace needs the full set, and MatrixCtrl's own namespace needs only a pod list
for the diagnostics page. Granting the full set in both would put the panel's own
Postgres secret inside its own blast radius for no reason.
*/}}
{{- $essNS := .Values.ess.namespace -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matrixctrl
  namespace: {{ $essNS }}
  labels:
    {{- include "matrixctrl.labels" . | nindent 4 }}
rules:
  # --- What MatrixCtrl reads and does itself ---------------------------------

  # Pod list, drill-down, rollout progress, and two deletes: restart-a-pod, and
  # cleaning up Evicted pods (k8s/pods.go, k8s/node.go:105). Helm's `--wait` also
  # watches pods for readiness.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Reading a volume no other pod mounts.
  #
  # Synapse's uploaded files live on a PVC that only the Synapse pod mounts, so every
  # archive MatrixCtrl produced listed the media as *not included* — nothing outside
  # that pod can see them. The exec subresource is the way in, and the operator was
  # asked before it was built: "Darf MatrixCtrl in Pods hineingreifen: JA!" (2026-09-20).
  #
  # What that buys, stated plainly: exec in the Synapse pod is arbitrary command
  # execution in another workload. Whoever holds it can read the media, the homeserver
  # config and the signing key. It is granted here rather than in the ClusterRole so it
  # exists in the managed namespace and nowhere else (§4.38), and without resourceNames
  # because the pod is found by label and its name is generated — a name list would be
  # exactly the kind of silent breakage etappe 104 is about.
  #
  # It was in ForbiddenAlways until etappe 104. Etappe 102 shipped the code that needs
  # it and not this rule, so the feature was dead on arrival and the checkbox sat greyed
  # out (§4.104).
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

  # Events carry the *reason* a pod is unhealthy; without them the drill-down can
  # only say that it is.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # --- What Helm needs to install, upgrade and roll back the chart ------------
  #
  # One verb set throughout: Helm creates, reads back, three-way-merge patches and
  # deletes on rollback, and it decides at apply time which verb each object gets.
  # Splitting per kind would imply a precision that does not exist.

  # Release storage lives in Secrets, and the chart renders Secrets of its own.
  # This is the rule that made P0-4a a P0 while it was cluster-wide.
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "serviceaccounts",
                "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Read-only, and the chart never renders one. Needed because `--wait` is on for
  # install, upgrade and rollback: Helm's readiness check for a Deployment calls
  # GetNewReplicaSet, which **lists** ReplicaSets. Neither the chart nor our own
  # code mentions ReplicaSets, so this rule is invisible to both sources the
  # permission list is otherwise derived from — E37 shipped its first draft without
  # it, which would have made every ESS upgrade apply and then fail while waiting.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Helm hooks: init-secrets, deployment-markers (pre/post), synapse-check-config.
  # These never appear in `helm get manifest`, so a role built by reading the live
  # release would fail on the next upgrade instead of now.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # matrix-stack renders three namespaced Roles. Kubernetes refuses to let an
  # account create a Role granting permissions it does not itself hold; those three
  # grant secrets create/get/update, configmaps create/get/update, pods list and
  # statefulsets list/get/update — all of which the rules above hold *in this
  # namespace*. So escalation prevention is satisfied without `escalate` or `bind`,
  # and it is satisfied more tightly than before: the permissions being granted and
  # the permissions being held are now confined to the same namespace.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Its own Role here, for the update from the panel (etappe 116): an upgrade of this
  # chart rewrites it, and a new version may add a right — which needs `escalate`, named
  # to this one role. The unnamed `escalate` stays denied (ForbiddenAlways).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["matrixctrl"]
    verbs: ["escalate", "bind"]

  # Conditional kinds, rendered only when the cluster has the matching operator.
  # Granted unconditionally: a missing CRD makes the rule inert, while a missing
  # rule makes an upgrade fail halfway, and a half-applied release is a state this
  # install has already had to be recovered from once.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matrixctrl
  namespace: {{ $essNS }}
  labels:
    {{- include "matrixctrl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matrixctrl
subjects:
  - kind: ServiceAccount
    name: matrixctrl
    namespace: {{ .Release.Namespace }}
{{- if ne $essNS .Release.Namespace }}
---
{{/*
MatrixCtrl's own namespace: the pod count on the diagnostics page, and — since
etappe 116 — everything a Helm upgrade of this chart writes, for the update from
the panel. See the rules below for what that costs.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matrixctrl-self
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrixctrl.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list"]

  # --- Update from the panel (etappe 116, operator decision 2026-09-30) ---------------
  # Until 116 this Role held a pod list and nothing else: "the panel does not administer
  # itself". It does now — the operator chose a complete Helm upgrade from the panel —
  # and an upgrade of this chart is Helm writing every object in this namespace. That
  # includes the panel's own Postgres secret, which the old comment kept deliberately
  # out of reach. The update itself runs in a Job (Recreate would kill it otherwise),
  # under this same ServiceAccount.
  - apiGroups: [""]
    resources: ["secrets"]           # Helm's release storage, and the chart's own Secret
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    # No delete: a version that drops a volume claim fails and rolls back, instead of
    # taking the panel's database with it.
    resources: ["persistentvolumeclaims"]
    verbs: ["watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]       # `helm --wait` follows the rollout through them
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    resourceNames: ["matrixctrl-self"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["matrixctrl-self"]
    verbs: ["escalate", "bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matrixctrl-self
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrixctrl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matrixctrl-self
subjects:
  - kind: ServiceAccount
    name: matrixctrl
    namespace: {{ .Release.Namespace }}
{{- end }}
